[package]
name = "vibewatch"
version = "0.2.0"
authors = ["csh <458761603@qq.com>"]
edition = "2021"
resolver = "2"
rust-version = "1.77"

[[bin]]
name = "vibewatch"
harness = false         # do not use the built in cargo test harness -> resolve rust-analyzer errors

[profile.release]
opt-level = "s"

[profile.dev]
debug = true    # Symbols are nice and they don't increase the size on Flash
opt-level = "z"

[features]
default = []

experimental = ["esp-idf-svc/experimental"]


[dependencies]
log = "0.4"
anyhow = "1.0"

esp-idf-svc = "0.52.1"
embedded-svc = "0.29.0"
esp32-nimble = "0.12.0"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# UI
embedded-graphics = "0.8.1"
embedded-graphics-terminal = "0.1.2"
embedded-text = "0.7.2"
u8g2-fonts = { version = "0.8", features = ["embedded_graphics_textstyle"] }
tinygif = "0.0.4"
vt100 = "0.16.2"

tokio = { version = "1.43.0", features = [
    "net",
    "rt",
    "sync",
    "time",
    "io-std",
    "io-util",
    "macros",
] }

[build-dependencies]
embuild = "0.33"

[[package.metadata.esp-idf-sys.extra_components]]
component_dirs = ["components/board"]
bindings_header = "components/board/board.h"
bindings_module = "board"

# esp_new_jpeg: 硬件 JPEG 解码(remote component),用于解码 vibetty 推来的整屏 JPEG
# 不设 bindings_module → bindings 直接进 esp_idf_svc::sys 顶层(new_jpg.rs 用 `use sys::*`)
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp_new_jpeg", version = "^1.0.0" }
bindings_header = "components/esp_new_jpeg/bindgen.h"

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "waveshare/esp32_s3_touch_amoled_2_06", version = "^2.0.0" }


# microlink:C 语言的 Tailscale 客户端组件。使用 L-jasmine 的 fork:
# 任务栈从 PSRAM 分配(见 fork 上 "Create internal tasks with PSRAM stacks")。
# wireguard_lwip 嵌在 microlink 仓库 components/microlink/components/ 里,
# 所以要两条 remote_component 分别指向两个子路径。
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "microlink", version = "main", git = "https://github.com/L-jasmine/microlink", path = "components/microlink" }
bindings_header = "components/microlink/bindgen.h"
bindings_module = "microlink"

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "wireguard_lwip", version = "main", git = "https://github.com/L-jasmine/microlink", path = "components/microlink/components/wireguard_lwip" }
